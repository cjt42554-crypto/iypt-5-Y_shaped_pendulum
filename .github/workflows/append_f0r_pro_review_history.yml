name: Append F0R Pro review history

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/append_f0r_pro_review_history.yml

permissions:
  contents: write

jobs:
  append-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append review history and remove one-shot workflow
        shell: bash
        env:
          ENTRY_B64: ""
          MARKER: "# 2026-08-29：F0R Pro 独立静态复审通过与实验前暂停门"
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          history = Path("90_候选工作区/交接说明_history.md")
          workflow = Path(".github/workflows/append_f0r_pro_review_history.yml")
          text = history.read_text(encoding="utf-8")
          marker = os.environ["MARKER"]
          if marker not in text.splitlines():
              entry = base64.b64decode(os.environ["ENTRY_B64"]).decode("utf-8")
              separator = "" if not text or text.endswith("\n\n") else ("\n" if text.endswith("\n") else "\n\n")
              history.write_text(text + separator + entry, encoding="utf-8")
          workflow.unlink()
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(f0r): archive Pro review and remove one-shot workflow'
          git push origin HEAD:main
