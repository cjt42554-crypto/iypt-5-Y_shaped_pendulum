name: Diagnose high-fidelity tests from package root

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests from declared package working directory
        run: |
          set +e
          package="02_模拟程序/02_第一性原理高保真模拟器/Y-Pendulum-Simulator-v1.0.0-rc1"
          python3 -m venv /tmp/yp-hf
          /tmp/yp-hf/bin/python -m pip install --upgrade pip >/dev/null 2>&1
          /tmp/yp-hf/bin/python -m pip install -e "./${package}[dev]" >/dev/null 2>&1
          log=/tmp/hf-package-root.log
          (
            cd "$package"
            /tmp/yp-hf/bin/python -m pytest -q tests
          ) >"$log" 2>&1
          status=$?
          result="90_候选工作区/current/hf-package-root-diagnostic.txt"
          {
            printf 'status=%s\n' "$status"
            printf 'source_sha=%s\n' "$GITHUB_SHA"
            tail -n 600 "$log"
          } > "$result"
          rm -f .github/workflows/diagnose-hf-from-package-root.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/diagnose-hf-from-package-root.yml "$result"
          git commit -m "Record high-fidelity package-root diagnostics"
          git push
