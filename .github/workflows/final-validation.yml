name: Final repository validation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate final repository state
        env:
          MPLBACKEND: Agg
        run: |
          set +e
          log=/tmp/final-validation.log
          summary=/tmp/final-validation-summary.txt
          : > "$log"
          : > "$summary"
          failed=0

          run_step() {
            label="$1"
            shift
            printf '\n[%s]\n$' "$label" >> "$log"
            printf ' %q' "$@" >> "$log"
            printf '\n' >> "$log"
            "$@" >> "$log" 2>&1
            status=$?
            printf '%s=%s\n' "$label" "$status" >> "$summary"
            if (( status != 0 )); then
              failed=1
            fi
          }

          run_step policy python3 tools/check_repository_policy.py
          if [[ -f tools/check_markdown_math.py ]]; then
            run_step markdown_math python3 tools/check_markdown_math.py
          fi
          run_step git_diff_check git diff --check
          run_step launcher_syntax bash -n "02_模拟程序/02_第一性原理高保真模拟器/Y-Pendulum-Simulator-v1.0.0-rc1/启动Y形摆模拟器.sh"

          run_step create_forward_venv python3 -m venv /tmp/yp-forward
          run_step upgrade_forward_pip /tmp/yp-forward/bin/python -m pip install --upgrade pip
          run_step install_forward /tmp/yp-forward/bin/python -m pip install -e "./02_模拟程序/01_前向预测数值求解器/y_pendulum_forward_solver" pytest
          run_step test_forward /tmp/yp-forward/bin/python -m pytest -q "02_模拟程序/01_前向预测数值求解器/y_pendulum_forward_solver/tests"

          run_step create_hf_venv python3 -m venv /tmp/yp-hf
          run_step upgrade_hf_pip /tmp/yp-hf/bin/python -m pip install --upgrade pip
          run_step install_hf /tmp/yp-hf/bin/python -m pip install -e "./02_模拟程序/02_第一性原理高保真模拟器/Y-Pendulum-Simulator-v1.0.0-rc1[dev]"
          run_step test_hf /tmp/yp-hf/bin/python -m pytest -q "02_模拟程序/02_第一性原理高保真模拟器/Y-Pendulum-Simulator-v1.0.0-rc1/tests"

          run_step create_structure_venv python3 -m venv /tmp/yp-structure
          run_step upgrade_structure_pip /tmp/yp-structure/bin/python -m pip install --upgrade pip
          run_step install_structure_dependencies /tmp/yp-structure/bin/python -m pip install numpy scipy matplotlib
          run_step compile_structure /tmp/yp-structure/bin/python -m py_compile "02_模拟程序/03_结构性理论分析程序/torus_structure_analysis.py"
          run_step run_structure /tmp/yp-structure/bin/python "02_模拟程序/03_结构性理论分析程序/torus_structure_analysis.py"
          run_step structure_json test -s "90_候选工作区/current/验证与复现/结构性理论/results/structural_analysis_results.json"
          run_step structure_design_figure test -s "90_候选工作区/current/验证与复现/结构性理论/figures/geometry_frequency_design.png"
          run_step structure_compensation_figure test -s "90_候选工作区/current/验证与复现/结构性理论/figures/finite_amplitude_compensation.png"
          run_step structure_taut_figure test -s "90_候选工作区/current/验证与复现/结构性理论/figures/taut_domain_map.png"

          status=PASS
          if (( failed != 0 )); then status=FAIL; fi
          result="90_候选工作区/current/final-validation-result.txt"
          mkdir -p "$(dirname "$result")"
          {
            printf 'status=%s\n' "$status"
            printf 'source_sha=%s\n' "$GITHUB_SHA"
            cat "$summary"
            printf 'log_gzip_base64='
            gzip -c "$log" | base64 -w0
            printf '\n'
          } > "$result"

          rm -rf "90_候选工作区/current/验证与复现/结构性理论"
          rm -f .github/workflows/final-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/final-validation.yml "$result"
          git commit -m "Record final repository validation"
          git push
          exit "$failed"
