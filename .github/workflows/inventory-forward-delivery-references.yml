name: Inventory obsolete forward delivery references

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record all obsolete provenance references
        run: |
          set -euo pipefail
          output="90_候选工作区/current/forward-delivery-reference-inventory.txt"
          grep -RInE 'delivery_root|delivery root|delivery-root|frozen forward|frozen Stage-2|forward_chain' \
            "02_模拟程序/02_第一性原理高保真模拟器/Y-Pendulum-Simulator-v1.0.0-rc1" \
            --exclude-dir=.pytest_cache --exclude-dir=__pycache__ > "$output" || true
          rm -f .github/workflows/inventory-forward-delivery-references.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/inventory-forward-delivery-references.yml "$output"
          git commit -m "Inventory obsolete provenance references"
          git push
