name: Patch Y finalizer

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dedent generated Python modules and remove this helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/finalize-y-platform.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '          from pathlib import Path\n',
              '          from pathlib import Path\n          from textwrap import dedent\n',
              1,
          )
          text = text.replace(
              '          text = text[:chain_start] + new_chain + text[chain_end:]\n',
              '          new_chain = dedent(new_chain)\n          text = text[:chain_start] + new_chain + text[chain_end:]\n',
              1,
          )
          text = text.replace(
              '          text = text[:tail_start] + new_tail\n',
              '          new_tail = dedent(new_tail)\n          text = text[:tail_start] + new_tail\n',
              1,
          )
          text = text.replace(
              '          test_text = test_text[:tests_start] + new_tests + test_text[tests_end:]\n',
              '          new_tests = dedent(new_tests)\n          test_text = test_text[:tests_start] + new_tests + test_text[tests_end:]\n',
              1,
          )
          required = ('from textwrap import dedent', 'new_chain = dedent(new_chain)', 'new_tail = dedent(new_tail)', 'new_tests = dedent(new_tests)')
          if not all(token in text for token in required):
              raise RuntimeError('failed to patch finalizer deterministically')
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/patch-finalizer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Y-platform finalizer generation"
          git push
