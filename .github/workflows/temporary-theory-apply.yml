name: Temporary release and junction theory revision
on:
  push:
    branches: [main]
    paths: [.github/workflows/temporary-theory-apply.yml]
permissions:
  contents: write
jobs:
  apply-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply reviewed patch with source and destination hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          repo = 'cjt42554-crypto/iypt-5-Y_shaped_pendulum'
          shas = ['9a14a12fac2b3f5e138792c72efc8705a88538e0', '4703819ecc9c329e4ed5107ec86392b6377ec718', '796b44261113b236e1c3127bb6bf9b99f4f7244c', '473e6ae24a9583c994b98de18dc4a065b58c40ef']
          chunks = []
          for sha in shas:
              req = urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{sha}', headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  obj = json.load(response)
              chunks.append(base64.b64decode(obj['content']))
          raw = b''.join(chunks)
          assert hashlib.sha256(raw).hexdigest() == '7c4fc605cd846ed2d2beaab64063c4ac497fe7968a20f61940487868d35dc7af'
          payload = json.loads(lzma.decompress(raw))
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip() == payload['base']
          allowed = {'README.md','00_项目管理/交接说明_current.md','01_最终理论/01-前向预测理论.md','01_最终理论/02-前向预测理论的数值计算理论.md','01_最终理论/README.md'}
          prefix = '03_研究记录/维护/2026-09-05_释放与结点模型修订/'
          for path in payload['expected']:
              p = pathlib.PurePosixPath(path)
              assert not p.is_absolute() and '..' not in p.parts
              assert path in allowed or path.startswith(prefix)
          patch = payload['patch'].encode()
          subprocess.run(['git','apply','--unidiff-zero','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--unidiff-zero','-'],input=patch,check=True)
          for entry in payload['new']:
              p = pathlib.Path(entry['path'])
              assert not p.exists() and entry['old_sha256'] is None
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(entry['content'],encoding='utf-8')
          for name, expected in payload['expected'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == expected, name
          assert pathlib.Path('00_项目管理/交接说明_history.md').stat().st_size == 0
          subprocess.run(['git','diff','--exit-code','--','02_模拟程序'],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          pathlib.Path('/tmp/theory-payload-paths.json').write_text(json.dumps(list(payload['expected']),ensure_ascii=False))
          print('Reviewed patch and all 15 destination hashes verified; production solver and history unchanged.')
          PY
      - name: Install verification dependencies
        run: |
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0' 'sympy==1.14.0'
          python -m pip install -e '02_模拟程序/01_前向预测数值求解器/y_pendulum_forward_solver'
      - name: Independent theory, documentation, and full existing solver regression
        run: |
          python - <<'PY'
          import json, os, pathlib, re, subprocess, sys
          root = pathlib.Path.cwd()
          rec = root/'03_研究记录/维护/2026-09-05_释放与结点模型修订'
          local_result = (rec/'results.json').read_bytes()
          commands = [
            ('theory-remote.txt', [sys.executable,str(rec/'verify_release_junction.py')],root,60),
            ('docs-unit-remote.txt',[sys.executable,'-m','unittest','discover','-s','tools','-p','test_repository_docs.py','-v'],root,60),
            ('docs-entry-remote.txt',[sys.executable,'tools/check_repository_docs.py'],root,60),
            ('solver-regression-remote.txt',[sys.executable,'-m','unittest','discover','-s','tests','-v'],root/'02_模拟程序/01_前向预测数值求解器/y_pendulum_forward_solver',480),
          ]
          results = []
          for name, cmd, cwd, timeout in commands:
              print('Running',name,flush=True)
              try:
                  with (rec/name).open('w') as log:
                      proc = subprocess.run(cmd,cwd=cwd,stdout=log,stderr=subprocess.STDOUT,timeout=timeout)
                  if name == 'theory-remote.txt':
                      (rec/'results-remote.json').write_bytes((rec/'results.json').read_bytes())
                      (rec/'results.json').write_bytes(local_result)
                  text = (rec/name).read_text()
                  print(text[-2400:],flush=True)
                  result = {'log':name,'returncode':proc.returncode,'test_count':int(re.search(r'Ran (\d+) tests?',text).group(1)) if re.search(r'Ran (\d+) tests?',text) else None}
                  results.append(result)
                  (rec/'remote-summary.json').write_text(json.dumps(results,ensure_ascii=False,indent=2)+'\n')
                  if proc.returncode:
                      raise RuntimeError('Verification failed: '+name)
              except subprocess.TimeoutExpired:
                  results.append({'log':name,'status':'timeout','seconds':timeout})
                  (rec/'remote-summary.json').write_text(json.dumps(results,ensure_ascii=False,indent=2)+'\n')
                  raise
          assert results[0]['test_count'] == 22
          assert results[1]['test_count'] == 16
          assert results[3]['test_count'] == 113
          suffix = '\n## 本轮远端完整复跑\n\n在完整仓库上独立复跑：22 项理论核查、16 项文档检查器自测、活动入口检查及原有正式求解器 113 项测试均通过。原始日志分别为 `theory-remote.txt`、`docs-unit-remote.txt`、`docs-entry-remote.txt`、`solver-regression-remote.txt`，结构化摘要见 `remote-summary.json`；正式程序及其测试的字节内容未修改。保留本地超时日志，不用远端通过改写本地执行事实。未运行装置实验或大型 PDE 收敛研究。\n'
          with (rec/'README.md').open('a') as f: f.write(suffix)
          current = root/'00_项目管理/交接说明_current.md'
          with current.open('a') as f:
              f.write('\n## 本轮远端复跑结果\n\n完整仓库中的 22 项理论检查、16 项文档检查器自测、活动入口检查和原有正式求解器 113 项测试均通过；生产源码、配置及原测试未改。见[远端验证摘要](../03_研究记录/维护/2026-09-05_释放与结点模型修订/remote-summary.json)和同目录原始日志。这不等于新理论已经进入正式求解器，也不取代连续柔索的时空收敛或装置验证。\n')
          metadata = {'scientific_base':'65bd09f0ea27955dcf3421a3850dd00943079821','source_snapshot':'c955893c40c9a202c5e46e96f655dea85ad90c6b','publishing_parent':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'forward_theory_sha256':__import__('hashlib').sha256((root/'01_最终理论/01-前向预测理论.md').read_bytes()).hexdigest(),'production_tree_sha':subprocess.check_output(['git','rev-parse','HEAD:02_模拟程序'],text=True).strip()}
          (rec/'publication.json').write_text(json.dumps(metadata,ensure_ascii=False,indent=2)+'\n')
          subprocess.run([sys.executable,'tools/check_repository_docs.py'],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          PY
      - name: Commit and non-force push the verified scientific changes
        run: |
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test -z "$(git diff --name-only -- '02_模拟程序')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import json, pathlib, subprocess
          names = json.loads(pathlib.Path('/tmp/theory-payload-paths.json').read_text())
          rec = pathlib.Path('03_研究记录/维护/2026-09-05_释放与结点模型修订')
          names += [p.as_posix() for p in rec.iterdir() if p.is_file()]
          subprocess.run(['git','add','-f','--',*sorted(set(names))],check=True)
          PY
          git diff --cached --check
          git commit -m 'theory: admit release wavefronts and add finite-junction predictive model with independent verification'
          git push origin HEAD:main
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-junction-publication-evidence
          path: |
            03_研究记录/维护/2026-09-05_释放与结点模型修订/
            01_最终理论/01-前向预测理论.md
            00_项目管理/交接说明_current.md
          retention-days: 7
