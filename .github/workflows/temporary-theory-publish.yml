name: Temporary publish verified forward theory
on:
  push:
    branches: [main]
    paths: [.github/workflows/temporary-theory-publish.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
          lfs: false
      - name: Restore verified payload and original validation evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, lzma, os, pathlib, subprocess, zipfile
          repo = 'cjt42554-crypto/iypt-5-Y_shaped_pendulum'
          api = 'https://api.github.com/repos/'+repo
          def get(suffix):
              return subprocess.check_output(['curl','--fail','--silent','--show-error','--location','--retry','2','--max-time','45','-H','Authorization: Bearer '+os.environ['GH_TOKEN'],'-H','Accept: application/vnd.github+json',api+suffix])
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip() == '299d8a6dbb27328b082affdda6ebbcd4233bb3ec'
          shas = ['9a14a12fac2b3f5e138792c72efc8705a88538e0','4703819ecc9c329e4ed5107ec86392b6377ec718','796b44261113b236e1c3127bb6bf9b99f4f7244c','473e6ae24a9583c994b98de18dc4a065b58c40ef']
          raw = b''.join(base64.b64decode(json.loads(get('/git/blobs/'+sha))['content']) for sha in shas)
          assert hashlib.sha256(raw).hexdigest() == '7c4fc605cd846ed2d2beaab64063c4ac497fe7968a20f61940487868d35dc7af'
          payload = json.loads(lzma.decompress(raw))
          rec = pathlib.Path('03_研究记录/维护/2026-09-05_释放与结点模型修订')
          allowed = {'README.md','00_项目管理/交接说明_current.md','01_最终理论/01-前向预测理论.md','01_最终理论/02-前向预测理论的数值计算理论.md','01_最终理论/README.md'}
          for name in payload['expected']:
              p = pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert name in allowed or name.startswith(str(rec)+'/')
          patch = payload['patch'].encode()
          subprocess.run(['git','apply','--unidiff-zero','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--unidiff-zero','-'],input=patch,check=True)
          for entry in payload['new']:
              p = pathlib.Path(entry['path'])
              assert not p.exists()
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(entry['content'],encoding='utf-8')
          for name, expected in payload['expected'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == expected,name
          archive = get('/actions/artifacts/9959946613/zip')
          assert hashlib.sha256(archive).hexdigest() == '895010ff478f23f291814de41e2c4c6d88d138a9dd7a33a50d91e24c1e8acda3'
          z = zipfile.ZipFile(io.BytesIO(archive))
          for name in z.namelist():
              p = pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert name in {'00_项目管理/交接说明_current.md','01_最终理论/01-前向预测理论.md'} or name.startswith(str(rec)+'/')
              pathlib.Path(name).write_bytes(z.read(name))
          summary = json.loads((rec/'remote-summary.json').read_text())
          assert [x['returncode'] for x in summary] == [0,0,0,0]
          assert [x['test_count'] for x in summary] == [22,16,None,113]
          result = json.loads((rec/'results-remote.json').read_text())
          assert result['tests'] == {'run':22,'failures':0,'errors':0,'skipped':0}
          theory = pathlib.Path('01_最终理论/01-前向预测理论.md')
          assert hashlib.sha256(theory.read_bytes()).hexdigest() == '073ce907b4adcb9daca9bb41d9e275bc6c683472a326d113a1ee04eb9a634dcd'
          assert hashlib.sha256((rec/'verify_release_junction.py').read_bytes()).hexdigest() == '9d3db1588f40e399848d3d9c6fa79632cd8747a9561185acb2015e9b7560aa1e'
          assert 'Ran 113 tests in 115.279s' in (rec/'solver-regression-remote.txt').read_text()
          assert (rec/'solver-regression-remote.txt').read_text().rstrip().endswith('OK')
          raw_logs = ['solver-regression-initial-timeout.txt','solver-regression-local-timeout.txt']
          digests = {name:hashlib.sha256((rec/name).read_bytes()).hexdigest() for name in raw_logs}
          note = '# 发布收尾记录\n\n验证运行 `33935164378` 的 22 项理论核查、16 项文档自测、入口检查、113 项原求解器回归全部通过；其工作流整体失败发生在提交前，原因是两份本地超时原始日志的截断行保留了行末空格。未发生物理检查或求解器回归失败。\n\n本次恢复原始 artifact（SHA-256 `895010ff478f23f291814de41e2c4c6d88d138a9dd7a33a50d91e24c1e8acda3`），核对理论与检查脚本哈希、实际测试计数及退出码；不重复解释为新一次完整回归。只把上述两份原始日志排除在 Git 空白风格检查外，其余暂存文件照常检查，日志字节不改写，验证阈值不修改。初次恢复运行 `33935463006` 在 artifact 跨主机重定向处认证失败，未提交；改用不向跨主机重定向转发 API Authorization 的下载方式，仍校验同一 artifact 哈希。\n\n原始日志 SHA-256：\n\n'
          note += '\n'.join('- `'+name+'`：`'+digest+'`' for name,digest in digests.items())+'\n'
          (rec/'publication-note.md').write_text(note,encoding='utf-8')
          assert pathlib.Path('00_项目管理/交接说明_history.md').stat().st_size == 0
          assert subprocess.check_output(['git','rev-parse','HEAD:02_模拟程序'],text=True).strip() == 'eb6c01ef5461488ed14917d6d2f41fcf03851ee2'
          subprocess.run(['git','diff','--exit-code','--','02_模拟程序'],check=True)
          subprocess.run(['python','tools/check_repository_docs.py'],check=True)
          names = sorted(set(payload['expected']) | {p.as_posix() for p in rec.iterdir() if p.is_file()})
          subprocess.run(['git','add','-f','--',*names],check=True)
          exclusions = [':(exclude)'+str(rec/name) for name in raw_logs]
          subprocess.run(['git','diff','--cached','--check','--','.',*exclusions],check=True)
          print('Scientific payload, original verification evidence, empty history and unchanged production tree verified.')
          PY
      - name: Commit and non-force push
        run: |
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'theory: admit release wavefronts and add finite-junction predictive model with independent verification'
          git push origin HEAD:main
          git rev-parse HEAD
