name: Finalize forward theory assumptions
on:
  push:
    branches: [main]
    paths: [.github/workflows/theory-finalize.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Clarify tangent and time-window assumptions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('01_最终理论/01-前向预测理论.md')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='69b4532d4e8a8d7d4c5bd2e33ccfada1179a447e'
          s=p.read_text()
          pairs=[
              ('弹性牵引对材料切向的线性化为',r'弹性牵引对未归一化材料切向 $\boldsymbol r_{i,S}$ 的线性化为'),
              ('若装配后的质量算子 $M$ 正定、恢复算子 $K$ 在允许位移子空间上强制、耗散算子', '若装配后的质量算子 $M$ 自伴正定、恢复算子 $K$ 自伴且在允许位移子空间上具有正的强制性下界、耗散算子'),
              ('三个比值小仍不保证任意初态下环面准确。', '理想环面还忽略阻尼、空气浮力、风及支点运动；相应效应也须在所选观察窗的幅值、相位和轨迹误差预算内，不能仅核查质量和柔度。三个比值小仍不保证任意初态下环面准确。'),
              (r'若整个工作窗都处在 $x_i\ge\delta_i$，才可使用该段',r'受载平衡检验之外，动态工作窗还须检查 $x_i(S,t)=\lambda_i(S,t)-1$；只有它在整个工作窗都满足 $x_i(S,t)\ge\delta_i$，才可使用该段'),
          ]
          for old,new in pairs:
              assert s.count(old)==1,old
              s=s.replace(old,new)
          p.write_text(s)
          c=Path('90_候选工作区/交接说明_current.md')
          c.write_text(c.read_text()+'\n## 定稿复核\n\n明确局部切线是对未归一化材料切向求导，并写出线性能量算子的自伴条件；动态本构分段须检查实际时变伸长，而非只看静态预拉伸。环面降阶预算还需覆盖被忽略的阻尼、浮力、风和支点运动。定稿后重跑同一组 9 项回归，日志见同目录 final-validation.txt。\n')
          PY
      - name: Revalidate final manuscript
        shell: bash
        run: |
          set -euo pipefail
          d='90_候选工作区/current/2026-09-05_前向理论修订'
          { python3 "$d/check_theory.py"; git diff --check; } 2>&1 | tee "$d/final-validation.txt"
      - name: Commit and push final revision
        run: |
          set -euo pipefail
          rm .github/workflows/theory-finalize.yml
          test ! -s '90_候选工作区/交接说明_history.md'
          git diff --check
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '01_最终理论/01-前向预测理论.md' '90_候选工作区/交接说明_current.md' '90_候选工作区/current/2026-09-05_前向理论修订/final-validation.txt'
          git add -u .github/workflows/theory-finalize.yml
          git commit -m 'docs(theory): clarify tangent variables and dynamic approximation assumptions'
          git push origin HEAD:main
          git rev-parse HEAD
