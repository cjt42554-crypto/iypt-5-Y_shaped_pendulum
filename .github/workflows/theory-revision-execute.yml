name: Execute forward theory revision
on:
  push:
    branches: [main]
    paths: [.github/workflows/theory-revision-execute.yml]
permissions:
  contents: write
jobs:
  revise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply theory patch
        run: python3 .github/apply_theory_revision.py
      - name: Validate equations and manuscript
        shell: bash
        run: |
          set -euo pipefail
          evidence='90_候选工作区/current/2026-09-05_前向理论修订'
          {
            python3 --version
            python3 "$evidence/check_theory.py"
            if test -f tools/check_markdown_math.py; then
              python3 tools/check_markdown_math.py
            else
              echo 'No root Markdown checker; display delimiters and equation tags checked by theory regression.'
            fi
            git diff --check
          } 2>&1 | tee "$evidence/validation.txt"
      - name: Commit and push verified revision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path('90_候选工作区/交接说明_current.md')
          p.write_text(p.read_text()+'\n## 本轮实际提交前验证\n\n独立代数和文档回归 9 项通过；新增公式标签唯一且显示公式分隔符配对；git diff --check 通过。实际日志保存在上述 validation.txt。工作流运行编号：`'+os.environ['GITHUB_RUN_ID']+'`。本轮未运行生产求解器完整测试。\n')
          Path('.github/apply_theory_revision.py').unlink()
          Path('.github/workflows/theory-revision-execute.yml').unlink()
          assert Path('90_候选工作区/交接说明_history.md').stat().st_size==0
          PY
          git diff --check
          git diff --stat
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '01_最终理论/01-前向预测理论.md' '90_候选工作区/交接说明_current.md' '90_候选工作区/交接说明_history.md' '90_候选工作区/current/2026-09-05_前向理论修订'
          git add -u .github/apply_theory_revision.py .github/workflows/theory-revision-execute.yml
          git commit -m 'docs(theory): add taut-domain and finite-horizon reduction error conditions'
          git push origin HEAD:main
          git rev-parse HEAD
