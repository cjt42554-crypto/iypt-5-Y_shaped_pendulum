schema_version: "1.0"
run:
  name: high_fidelity_independence_torque
  mode: high_fidelity
  seed: 20260821
  output_directory: runs/high_fidelity_independence_torque
  claim_level: VERIFIED

environment:
  gravity: {value: [0.0, 0.0, 9.80665], unit: m/s^2, source: standard}
  air_density: {value: 1.2, unit: kg/m^3, source: measured_environment}
  air_velocity: {value: [0.0, 0.0, 0.0], unit: m/s, source: measured_environment}

supports:
  A:
    type: fixed
    position: {value: [-0.15, 0.0, 0.0], unit: m, source: controlled_case}
  B:
    type: fixed
    position: {value: [0.15, 0.0, 0.0], unit: m, source: controlled_case}

junction:
  mass: {value: 0.003, unit: kg, source: controlled_case}
  drag_linear: {value: 0.0, unit: N*s/m, source: disabled_for_isolation}

bob:
  mass: {value: 0.08, unit: kg, source: controlled_case}
  radius: {value: 0.01999794636444272, unit: m, source: controlled_case}
  drag:
    enabled: false
    model: quadratic_plus_linear
    cd: {value: 0.47, unit: dimensionless, source: inactive}
    linear_coefficient: {value: 0.0, unit: N*s/m, source: inactive}
  buoyancy: false

cables:
  upper_A:
    rest_length: {value: 0.288, unit: m, source: controlled_case}
    diameter: {value: 0.003, unit: m, source: controlled_case}
    density: {value: 1414.710605261292, unit: kg/m^3, source: controlled_case}
    young_modulus: {value: 1697652.7263135503, unit: Pa, source: controlled_case}
    axial_viscosity: {value: 1414.710605261292, unit: Pa*s, source: controlled_case}
    elements: 12
    drag_cd_normal: 0.0
    drag_cd_tangent: 0.0
    drag_linear_normal_per_length: {value: 0.0, unit: N*s/m^2}
    drag_linear_tangent_per_length: {value: 0.0, unit: N*s/m^2}
    drag_enabled: false
    material_model: linear_kelvin_voigt_tension_only
  upper_B:
    inherit: upper_A
  lower:
    rest_length: {value: 0.326, unit: m, source: controlled_case}
    diameter: {value: 0.003, unit: m, source: controlled_case}
    density: {value: 1697.6527263135504, unit: kg/m^3, source: controlled_case}
    young_modulus: {value: 1697652.7263135503, unit: Pa, source: controlled_case}
    axial_viscosity: {value: 1697.6527263135504, unit: Pa*s, source: controlled_case}
    elements: 20
    drag_cd_normal: 0.0
    drag_cd_tangent: 0.0
    drag_linear_normal_per_length: {value: 0.0, unit: N*s/m^2}
    drag_linear_tangent_per_length: {value: 0.0, unit: N*s/m^2}
    drag_enabled: false
    material_model: linear_kelvin_voigt_tension_only

initial_condition:
  type: geometric_direct_release
  junction_position: {value: [0.0, 0.0, 0.25], unit: m, source: controlled_case}
  junction_velocity: {value: [0.0, 0.0, 0.0], unit: m/s, source: controlled_case}
  bob_position: {value: [0.06, 0.02, 0.60], unit: m, source: controlled_case}
  bob_velocity: {value: [0.0, 0.0, 0.0], unit: m/s, source: controlled_case}
  bob_angular_velocity: {value: [0.0, 0.0, 0.0], unit: rad/s, source: controlled_case}

solver:
  profile: quick
  t_end: {value: 0.002, unit: s}
  output_dt: {value: 0.0000025, unit: s}
  max_step: {value: 0.00000125, unit: s}
  mass_matrix: lumped
  method: Radau
  resolve_longitudinal_waves: true
  analytic_jacobian: true
  allow_subminimum_mesh: false
  rtol: 1.0e-9
  position_atol: {value: 1.0e-11, unit: m}
  velocity_atol: {value: 1.0e-10, unit: m/s}
  quaternion_atol: 1.0e-11
  angular_velocity_atol: {value: 1.0e-10, unit: rad/s}
  static:
    method: energy_minimize
    force_tolerance: {value: 1.0e-8, unit: N}
    max_iterations: 100
    continuation_steps: 4
    line_search_min: 1.0e-5

analysis:
  target_ratio: [3, 2]
  phase_tolerance: {value: 0.2, unit: rad}
  slow_period_count: 10
  compute_spectrum: false
  compute_uncertainty: false

observer:
  type: orthographic_xy

high_fidelity:
  model_id: HF-DISCRETE-ROD-RIGID-BOB-1.0
  axial_material_model: passive_unilateral_bilateral_kelvin_voigt_blend
  bending_stiffness_scale: 1.0
  compression_regularization_scale: 1.0
  controlled_limit_study: false
  bob_inertia_factor: 0.4
  bob_attachment_radius_fraction: 1.0
  bob_contact_radius_fraction: 1.0
  quaternion_stabilization_rate:
    value: 1.0
    unit: 1/s
    source: numerical_constraint_stabilization
  contact_guard_enabled: true
  minimum_clearance: {value: 0.0002, unit: m}
