[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "y-pendulum-forward-solver"
version = "2.1.0"
description = "Research numerical implementations of cable, torus and finite-junction Y-pendulum models"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.6",
]

[project.scripts]
y-pendulum-forward = "y_pendulum_forward.cli:main"

[tool.setuptools]
packages = ["y_pendulum_forward"]
