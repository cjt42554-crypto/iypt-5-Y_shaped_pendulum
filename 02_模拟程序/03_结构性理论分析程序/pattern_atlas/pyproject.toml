[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "y-pendulum-pattern-atlas"
version = "1.1.0"
description = "Repository-bound ideal-torus parameter-pattern atlas"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema==4.10.3",
  "matplotlib==3.8.4",
  "numpy==1.26.4",
  "scipy==1.11.4",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.16.5"]

[project.scripts]
y-pendulum-pattern-atlas = "y_pendulum_pattern_atlas.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["E501"]
