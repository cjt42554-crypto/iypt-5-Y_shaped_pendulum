schema_version: "1.0"
run:
  name: high_fidelity_shared_forward_window
  mode: high_fidelity
  seed: 20260821
  output_directory: runs/high_fidelity_shared_forward_window
  claim_level: VERIFIED

# This configuration intentionally shares the raw SI geometry, distributed
# masses, axial EA/Ca values and rigid-body initial state of the frozen Stage-2
# FWD-CABLE reference.  Diameter, circular-section bending, rigid-bob radius
# and attachment offset are HF-only measured/derived inputs and are never
# inferred from a forward trajectory.  Because the eccentric lower attachment
# makes its endpoint chord shorter than the measured material length, the
# independent rod material coordinates are prepared by the explicitly frozen
# held-endpoint equilibrium protocol rather than by inventing a straight cable.
environment:
  gravity:
    value: [0.0, 0.0, 9.80665]
    unit: m/s^2
    source: standard
  air_density:
    value: 1.2
    unit: kg/m^3
    source: measured_environment
  air_velocity:
    value: [0.0, 0.0, 0.0]
    unit: m/s
    source: measured_environment

supports:
  A:
    type: fixed
    position:
      value: [-0.15, 0.0, 0.0]
      unit: m
      source: shared_frozen_forward_input
  B:
    type: fixed
    position:
      value: [0.15, 0.0, 0.0]
      unit: m
      source: shared_frozen_forward_input

junction:
  mass:
    value: 0.003
    unit: kg
    source: shared_frozen_forward_input
  drag_linear:
    value: 0.0
    unit: N*s/m
    source: bounded_as_negligible

bob:
  mass:
    value: 0.08
    unit: kg
    source: shared_frozen_forward_input
  radius:
    value: 0.01999794636444272
    unit: m
    source: derived_from_shared_bob_volume_as_sphere
  drag:
    enabled: true
    model: quadratic_plus_linear
    cd:
      value: 5.306254425059426
      unit: dimensionless
      source: mapped_from_shared_c2_for_same_frontal_area
    linear_coefficient:
      value: 0.0015
      unit: N*s/m
      source: shared_frozen_forward_input
  buoyancy: true

cables:
  upper_A:
    rest_length:
      value: 0.288
      unit: m
      source: shared_frozen_forward_input
    diameter:
      value: 0.003
      unit: m
      source: hf_local_geometry_input
    density:
      value: 1414.710605261292
      unit: kg/m^3
      source: derived_from_shared_mu_and_hf_diameter
    young_modulus:
      value: 1697652.7263135503
      unit: Pa
      source: derived_from_shared_EA_and_hf_diameter
    axial_viscosity:
      value: 1414.710605261292
      unit: Pa*s
      source: derived_from_shared_Ca_and_hf_diameter
    elements: 24
    drag_cd_normal: 0.5555555555555556
    drag_cd_tangent: 0.05555555555555556
    drag_linear_normal_per_length:
      value: 0.001
      unit: N*s/m^2
      source: shared_frozen_forward_input
    drag_linear_tangent_per_length:
      value: 0.0001
      unit: N*s/m^2
      source: shared_frozen_forward_input
    drag_enabled: true
    material_model: linear_kelvin_voigt_tension_only
  upper_B:
    inherit: upper_A
  lower:
    rest_length:
      value: 0.326
      unit: m
      source: shared_frozen_forward_input
    diameter:
      value: 0.003
      unit: m
      source: hf_local_geometry_input
    density:
      value: 1697.6527263135504
      unit: kg/m^3
      source: derived_from_shared_mu_and_hf_diameter
    young_modulus:
      value: 1697652.7263135503
      unit: Pa
      source: derived_from_shared_EA_and_hf_diameter
    axial_viscosity:
      value: 1697.6527263135504
      unit: Pa*s
      source: derived_from_shared_Ca_and_hf_diameter
    elements: 32
    drag_cd_normal: 0.5555555555555556
    drag_cd_tangent: 0.05555555555555556
    drag_linear_normal_per_length:
      value: 0.001
      unit: N*s/m^2
      source: shared_frozen_forward_input
    drag_linear_tangent_per_length:
      value: 0.0001
      unit: N*s/m^2
      source: shared_frozen_forward_input
    drag_enabled: true
    material_model: linear_kelvin_voigt_tension_only

initial_condition:
  type: held_endpoint_equilibrium_release
  junction_position:
    value: [0.0, 0.0, 0.25]
    unit: m
    source: shared_frozen_forward_input
  junction_velocity:
    value: [0.0, 0.0, 0.0]
    unit: m/s
    source: shared_frozen_forward_input
  bob_position:
    value: [0.035, 0.02, 0.58]
    unit: m
    source: shared_frozen_forward_input
  bob_velocity:
    value: [0.0, 0.0, 0.0]
    unit: m/s
    source: shared_frozen_forward_input
  bob_angular_velocity:
    value: [0.0, 0.0, 0.0]
    unit: rad/s
    source: hf_local_initial_input

solver:
  profile: production
  t_end:
    value: 0.12
    unit: s
  output_dt:
    value: 0.0000078125
    unit: s
  max_step:
    value: 0.0000078125
    unit: s
  mass_matrix: lumped
  method: Radau
  resolve_longitudinal_waves: true
  analytic_jacobian: true
  allow_subminimum_mesh: false
  rtol: 1.0e-8
  position_atol:
    value: 1.0e-10
    unit: m
  velocity_atol:
    value: 1.0e-9
    unit: m/s
  quaternion_atol: 1.0e-10
  angular_velocity_atol:
    value: 1.0e-9
    unit: rad/s
  static:
    method: energy_minimize
    force_tolerance:
      value: 1.0e-8
      unit: N
    max_iterations: 200
    continuation_steps: 6
    line_search_min: 1.0e-5

analysis:
  target_ratio: [3, 2]
  phase_tolerance:
    value: 0.2
    unit: rad
  slow_period_count: 30
  compute_spectrum: true
  compute_uncertainty: false

observer:
  type: orthographic_xy

high_fidelity:
  model_id: HF-DISCRETE-ROD-RIGID-BOB-1.0
  axial_material_model: passive_unilateral_bilateral_kelvin_voigt_blend
  bending_stiffness_scale: 1.0
  compression_regularization_scale: 1.0
  controlled_limit_study: false
  bob_inertia_factor: 0.4
  bob_attachment_radius_fraction: 1.0
  bob_contact_radius_fraction: 1.0
  quaternion_stabilization_rate:
    value: 1.0
    unit: 1/s
    source: numerical_constraint_stabilization
  contact_guard_enabled: true
  minimum_clearance:
    value: 0.0002
    unit: m
