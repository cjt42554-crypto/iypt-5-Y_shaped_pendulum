schema_version: YPS-HF-INDEPENDENCE-1.0

# The finite-physics run keeps the registered values at one.  The three limit
# runs simultaneously reduce only HF-exclusive interactions: three-point
# bending stiffness, bilateral compression regularisation, eccentric
# attachment radius, and finite bob/rod exclusion radius.  Mass, gravity,
# tensile axial law, supports, initial centre-of-mass state, mesh and
# integration settings remain frozen.  The leading 1 is the registered finite
# model; the runner executes the remaining three candidates as explicit
# OUT_OF_SCOPE controlled-limit studies.
limit_scales: [1.0, 0.01, 0.0001, 0.000001]
cauchy_ratio_slack: 1.5
cross_solver_floor_multiplier: 10.0
separation_factor: 100.0

# Every selected non-trivial dynamics metric below must exceed its frozen
# physical-resolution floor and one hundred times the Radau--BDF discrepancy.
minimum_separation_metric_count: 7
minimum_finite_to_limit:
  max_bob_position_m: 0.000001
  max_bob_velocity_m_s: 0.001
  max_junction_position_m: 0.00001
  max_bob_orientation_angle_rad: 0.00001
  max_bob_angular_velocity_rad_s: 0.01
  max_support_reaction_N: 0.00001
  max_rod_tension_N: 0.01

minimum_peak_bending_energy_J: 1.0e-10
minimum_peak_angular_velocity_rad_s: 0.01
material_comparison_points: 65

metadata:
  frozen_before_formal_run: true
  frozen_date: "2026-08-21"
  purpose: >-
    Demonstrate that HF-DISCRETE-ROD-RIGID-BOB-1.0 has measurable finite
    bending/rigid-body physics and a controlled contraction toward its
    axial-centre-attachment limit, rather than merely re-discretising
    FWD-CABLE.
  isolation_case_window_s: 0.002
  pilot_source_status: pre-freeze-only
  pilot_finite_peak_bending_energy_J: 8.202289760938873e-9
  pilot_finite_peak_bob_angular_velocity_rad_s: 0.21483984740440595
  pilot_smallest_selected_separation:
    metric: max_support_reaction_N
    value: 2.4564348673983272e-5
  pilot_limit_contraction: >-
    All 24 canonical comparison metrics contracted by approximately two
    orders of magnitude from scale-pair 1e-2/1e-4 to 1e-4/1e-6.
  no_post_result_relaxation: true
