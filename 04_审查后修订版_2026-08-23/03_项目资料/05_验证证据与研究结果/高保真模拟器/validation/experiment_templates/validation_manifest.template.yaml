schema_version: "1.1"
frozen: true
passed: false
claim_level: VALIDATED
frozen_at_utc: "YYYY-MM-DDTHH:MM:SSZ"
model_definition_hash_sha256: "REPLACE_WITH_64_HEX_CHARACTERS"
calibration_runs:
  - run_id: calibration-example
    sealed: true
    model_definition_hash_sha256: "REPLACE_WITH_THE_SAME_CURRENT_MODEL_HASH"
    data_path: calibration-data.csv
    data_sha256: "REPLACE_WITH_64_HEX_CHARACTERS"
    result_manifest_path: calibration-result-manifest.json
    result_manifest_sha256: "REPLACE_WITH_64_HEX_CHARACTERS"
    purpose: "Independent EA / damping / camera calibration"
validation_runs:
  - run_id: sealed-validation-example
    sealed: true
    model_definition_hash_sha256: "REPLACE_WITH_THE_SAME_CURRENT_MODEL_HASH"
    data_path: sealed-validation-data.csv
    data_sha256: "REPLACE_WITH_64_HEX_CHARACTERS"
    result_manifest_path: sealed-validation-result-manifest.json
    result_manifest_sha256: "REPLACE_WITH_64_HEX_CHARACTERS"
    geometry_was_unseen: true
metrics:
  frequency_ratio_relative_error:
    value: null
    threshold: 0.001
    comparison: less_than_or_equal
    passed: false
  ten_period_trajectory_normalized_rms:
    value: null
    threshold: 0.03
    comparison: less_than_or_equal
    passed: false
predictive_scope:
  unseen_conditions_passed: false
  description: "Set true only after a sealed new-geometry/new-release campaign passes."
notes:
  - "Do not set passed=true until all frozen metrics have been computed without retuning."
  - "The loader recomputes every file hash, the current Python model hash, and each metric inequality."
