[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yps-experiment-pipeline"
version = "0.2.0"
description = "Candidate-only real-shape experiment contracts and synthetic provenance checks for the Y-shaped pendulum"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema==4.10.3",
  "numpy==1.26.4",
  "scipy==1.11.4",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "ruff==0.16.5",
]

[project.scripts]
yps-experiment = "yps_experiment_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
