[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "y-pendulum-pattern-atlas-draft"
version = "0.2.0"
description = "Candidate formalization of the ideal-torus parameter-pattern atlas"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.10", "matplotlib>=3.6", "numpy>=1.26", "scipy>=1.11.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
y-pendulum-pattern-atlas = "y_pendulum_pattern_atlas.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["E501"]
