[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "y-pendulum-p3r5-stability-map-draft"
version = "0.1.0"
description = "Read-only reduced-Hessian map from the four frozen P3R5 scale cards"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.6", "numpy>=1.26", "scipy>=1.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["E501"]
