schema_version: YPS-HF-VALIDATION-1.0

# This file is the pre-run qualification contract for the independent
# HF-DISCRETE-ROD-RIGID-BOB-1.0 backend.  Once a formal 0.12 s matrix has
# started, these thresholds may not be relaxed in response to its outcome.
material_comparison_points: 129
cauchy_ratio_slack: 1.25
numerical_floor_fraction: 0.25
maximum_event_time_spread_s: 0.002

# Equal requested tolerances do not give equal local defects for Radau and
# BDF.  These factors are frozen before the formal matrix and are applied to
# every tolerance of the alternate-integrator candidate.  Pilot sweeps on the
# controlled torque case found BDF needs 1e-3 of the Radau request to satisfy
# the same 1e-4 independent local-defect contract.
cross_solver_tolerance_factors:
  Radau: 1.0
  BDF: 0.001

thresholds:
  space:
    rms_bob_position_m: 0.0002
    max_bob_position_m: 0.0005
