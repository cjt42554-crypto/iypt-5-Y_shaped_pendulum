physics_checks:
  # Every registered guard is divided by its own frozen physical scale before
  # certification.  3e-4 corresponds to about 97.8 micrometres for the
  # 0.326 m characteristic length, while remaining meaningful for the m^2 and
  # dimensionless socket/turn guards.
  minimum_normalized_guard_margin: 0.0003
  maximum_negative_dissipation_W: 1.0e-12
  maximum_energy_balance_residual: 5.0e-5
  maximum_quaternion_norm_error: 1.0e-8
  maximum_normalized_rate_defect: 1.0e-4
  maximum_normalized_nonsmooth_increment_defect: 1.0e-6
  maximum_normalized_signed_cumulative_defect: 2.0e-5
  maximum_normalized_absolute_cumulative_defect: 5.0e-5
  maximum_nonsmooth_time_fraction: 0.03
  maximum_nonsmooth_step_s: 0.00003125

