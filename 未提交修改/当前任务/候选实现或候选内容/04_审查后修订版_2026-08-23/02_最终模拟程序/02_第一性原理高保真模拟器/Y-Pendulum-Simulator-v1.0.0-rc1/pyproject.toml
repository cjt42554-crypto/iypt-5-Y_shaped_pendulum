[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ypendulum"
version = "1.0.0rc1"
description = "Y-pendulum platform with a forward tension-cable model and a discrete flexible-rod/finite-rigid-bob HF backend"
readme = {text = "项目说明已归档到 03_项目资料/03_使用说明与技术文档/高保真模拟器。", content-type = "text/plain"}
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "OpenAI"}]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "h5py>=3.9",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "pint>=0.23",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35", "plotly>=5.20"]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10", "build>=1.2"]
all = ["streamlit>=1.35", "plotly>=5.20", "pytest>=8", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10", "build>=1.2"]

[project.scripts]
ypendulum = "ypendulum.cli:main"
ypendulum-desktop = "ypendulum.ui.desktop_app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
