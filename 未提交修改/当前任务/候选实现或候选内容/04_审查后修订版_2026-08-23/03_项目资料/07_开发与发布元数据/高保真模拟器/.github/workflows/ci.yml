name: CI
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: mypy src/ypendulum
        continue-on-error: true
      - run: pytest -q
      - run: ypendulum validate-suite --fast --output-directory validation/ci
      - run: ypendulum validate-config configs/examples/full_quick_3to2.yaml
      - run: ypendulum diagnose configs/examples/full_quick_3to2.yaml --skip-equilibrium

  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[ui]'
      - name: Start Streamlit and probe health endpoint
        run: |
          streamlit run src/ypendulum/ui/app.py --server.headless true --server.port 8501 > /tmp/ui.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then
              kill $pid
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ui.log
          kill $pid || true
          exit 1
